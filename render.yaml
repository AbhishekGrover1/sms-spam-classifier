services:
  - type: web
    name: sms-spam-classifier
    runtime: python
    plan: free
    # install, then retrain so the saved model always matches the installed scikit-learn
    buildCommand: pip install -r requirements.txt && python -m src.train
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
